# StudyHub only stores expiring security state and read caches in Redis.
bind 127.0.0.1 -::1
protected-mode yes
port 6379
tcp-backlog 128
timeout 0
tcp-keepalive 60

supervised systemd
daemonize no
pidfile /run/redis/redis-server.pid
loglevel notice
logfile ""

databases 1
aclfile /etc/redis/studyhub-users.acl

# Security state is disposable. MySQL and OSS remain the sources of truth.
save ""
appendonly no

maxmemory 64mb
maxmemory-policy noeviction
maxclients 256

dir /var/lib/redis
dbfilename studyhub-dump.rdb
notify-keyspace-events ""
