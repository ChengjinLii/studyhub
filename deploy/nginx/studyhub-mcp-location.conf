# Replace the public server's existing `location = /mcp` block with this file.
# This limit is intentionally independent from multipart material uploads.
location = /mcp {
    client_max_body_size 256k;
    client_body_timeout 15s;
    proxy_pass http://studyhub_backend/mcp;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_connect_timeout 5s;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
}
