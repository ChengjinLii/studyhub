# Loaded from nginx's http context. Empty map keys are not accounted, which
# lets each limiter cover only the request classes named below.
map $request_method $studyhub_write_client {
    default "";
    ~^(POST|PUT|PATCH|DELETE)$ $binary_remote_addr;
}

map "$request_method:$uri" $studyhub_auth_client {
    default "";
    ~^GET:/api/(auth/captcha|captcha|captchas)$ $binary_remote_addr;
    ~^POST:/api/(session|auth/login|registration-verifications|registrations|auth/register|auth/verify|password-resets|auth/reset-password)$ $binary_remote_addr;
    ~^(POST|PUT):/api/(auth/bind-email|me/email)$ $binary_remote_addr;
}

map "$request_method:$uri" $studyhub_comment_create_client {
    default "";
    ~^POST:/api/comments$ $binary_remote_addr;
}

map "$request_method:$uri" $studyhub_ai_client {
    default "";
    ~^POST:/api/(ai-chats|ai/chat|ai-recommendations|ai/recommend)(/stream)?$ $binary_remote_addr;
}

map $uri $studyhub_mcp_client {
    default "";
    ~^/mcp(?:/|$) $binary_remote_addr;
}

map $uri $studyhub_model_client {
    default "";
    ~^/v1(?:/|$) $binary_remote_addr;
}

map $host $studyhub_host_allowed {
    default 0;
    study-hub.cn 1;
    localhost 1;
    127.0.0.1 1;
}

# HSTS must only be emitted over TLS. Keeping the value in an http-context map
# lets the shared server snippet cover both the port 80 redirect and TLS site.
map $scheme $studyhub_hsts_header {
    default "";
    https "max-age=15552000; includeSubDomains";
}

limit_req_zone $binary_remote_addr zone=studyhub_global:10m rate=30r/s;
limit_req_zone $studyhub_write_client zone=studyhub_write:5m rate=120r/m;
limit_req_zone $studyhub_auth_client zone=studyhub_auth:5m rate=30r/m;
limit_req_zone $studyhub_comment_create_client zone=studyhub_comment_create:5m rate=60r/m;
limit_req_zone $studyhub_ai_client zone=studyhub_ai:5m rate=12r/m;
limit_req_zone $studyhub_mcp_client zone=studyhub_mcp:5m rate=120r/m;
limit_req_zone $studyhub_model_client zone=studyhub_model:5m rate=30r/m;

limit_conn_zone $binary_remote_addr zone=studyhub_conn_per_ip:10m;
limit_conn_zone $server_name zone=studyhub_conn_server:1m;

log_format studyhub_guard '$remote_addr - $remote_user [$time_local] "$request" '
                          '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                          'request_time=$request_time upstream_time=$upstream_response_time '
                          'limit_req=$limit_req_status limit_conn=$limit_conn_status';
