# Include once inside every public StudyHub server block.
server_tokens off;

# Make Nginx the public source of truth for browser security headers. FastAPI
# keeps its own headers as defense in depth for direct loopback/test traffic;
# hide those upstream values here so public API responses contain one copy.
proxy_hide_header X-Content-Type-Options;
proxy_hide_header X-Frame-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header Permissions-Policy;
proxy_hide_header Content-Security-Policy;
proxy_hide_header Content-Security-Policy-Report-Only;
proxy_hide_header Strict-Transport-Security;

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Strict-Transport-Security "$studyhub_hsts_header" always;

# Observe violations before enforcing CSP. This deliberately preserves the
# current Next.js, OSS preview, SSE and Alipay flows while reports are reviewed.
add_header Content-Security-Policy-Report-Only "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; img-src 'self' data: blob: https:; font-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; connect-src 'self' https: wss:; form-action 'self' https://openapi.alipay.com https://openapi-sandbox.dl.alipaydev.com; report-uri /api/security/csp-reports" always;

# Reject direct-IP and stale-domain scans before proxying them into Next/FastAPI.
if ($studyhub_host_allowed = 0) {
    return 444;
}

# The global bucket is deliberately permissive. Endpoint-specific buckets
# below stop expensive abuse while preserving bursts from campus NATs.
limit_req zone=studyhub_global burst=120 nodelay;
limit_req zone=studyhub_write burst=60 nodelay;
limit_req zone=studyhub_auth burst=15 nodelay;
limit_req zone=studyhub_ai burst=4 nodelay;
limit_req zone=studyhub_mcp burst=30 nodelay;
limit_req zone=studyhub_model burst=10 nodelay;
limit_req_status 429;
limit_req_log_level notice;

limit_conn studyhub_conn_per_ip 128;
limit_conn studyhub_conn_server 1200;
limit_conn_status 429;
limit_conn_log_level notice;

# Bound slow clients without shortening upstream AI/MCP processing windows.
client_header_timeout 15s;
client_body_timeout 120s;
send_timeout 60s;
keepalive_timeout 20s;
keepalive_requests 500;
reset_timedout_connection on;

access_log /var/log/nginx/access.log studyhub_guard;

# Operational telemetry must never be exposed to ordinary public clients.
location = /api/metrics {
    allow 127.0.0.1;
    allow ::1;
    deny all;
    proxy_pass http://127.0.0.1:8311/api/metrics;
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
    proxy_send_timeout 15s;
}

location = /metrics {
    allow 127.0.0.1;
    allow ::1;
    deny all;
    proxy_pass http://127.0.0.1:8311/metrics;
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
    proxy_send_timeout 15s;
}

# Readiness includes provider and build details. Keep it on the source host.
location = /api/readyz {
    allow 127.0.0.1;
    allow ::1;
    deny all;
    proxy_pass http://127.0.0.1:8311/api/readyz;
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
    proxy_send_timeout 15s;
}

location = /readyz {
    allow 127.0.0.1;
    allow ::1;
    deny all;
    proxy_pass http://127.0.0.1:8311/readyz;
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
    proxy_send_timeout 15s;
}

location = /nginx_status {
    allow 127.0.0.1;
    allow ::1;
    deny all;
    access_log off;
    stub_status;
}
