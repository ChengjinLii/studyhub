<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>StudyHub Entry Poster Prototype</title>
  <style>
    :root {
      --poster-w: min(96vw, 1280px);
      --ink: #08090d;
      --muted: #40404a;
      --teal: #7ccbc6;
      --paper: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f3f4f6;
      color: #111827;
      font-family: Inter, "Noto Sans SC", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .workspace {
      display: grid;
      gap: 14px;
      justify-items: center;
    }

    .toolbar {
      width: var(--poster-w);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 12px;
      border: 1px solid #d7dce5;
      border-radius: 12px;
      background: #ffffff;
      box-shadow: 0 8px 22px rgba(15, 23, 42, 0.08);
      font-size: 14px;
    }

    .toolbar label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      cursor: pointer;
    }

    .toolbar small {
      color: #64748b;
    }

    .poster-shell {
      width: var(--poster-w);
      aspect-ratio: 16 / 9;
      position: relative;
      container-type: size;
      border-radius: 6px;
      background: #d1d5db;
      box-shadow: 0 20px 50px rgba(15, 23, 42, 0.18);
      overflow: hidden;
    }

    .poster {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: var(--paper);
      color: var(--ink);
      isolation: isolate;
    }

    .poster-reference {
      position: absolute;
      inset: 0;
      z-index: 50;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.16s ease;
      mix-blend-mode: multiply;
    }

    #show-reference:checked ~ .poster-shell .poster-reference {
      opacity: 0.52;
    }

    .brand {
      position: absolute;
      top: 2.3%;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 2.4cqw;
      line-height: 1;
      font-weight: 900;
      letter-spacing: 0.03em;
      color: #33333a;
      text-transform: uppercase;
      z-index: 10;
    }

    .address-bar {
      position: absolute;
      top: 7.4%;
      left: 15%;
      width: 70%;
      height: 12.2%;
      border-radius: 2.7vw;
      background: rgba(49, 49, 53, 0.86);
      display: flex;
      align-items: center;
      padding: 0 4.1% 0 4.2%;
      gap: 2.2%;
      z-index: 10;
    }

    .dot {
      width: 2.1%;
      aspect-ratio: 1;
      border-radius: 50%;
      flex: 0 0 auto;
    }

    .dot.red { background: #f26a60; }
    .dot.yellow { background: #f3c85a; }
    .dot.green { background: #78cf79; }

    .url {
      flex: 1;
      text-align: center;
      color: #ffffff;
      font-family: Georgia, "Times New Roman", "Noto Serif SC", serif;
      font-size: 4.6cqw;
      font-weight: 900;
      letter-spacing: -0.02em;
      line-height: 1;
      white-space: nowrap;
    }

    .search-icon {
      width: 9.4%;
      aspect-ratio: 1;
      border: 7px solid #ffffff;
      border-radius: 50%;
      flex: 0 0 auto;
      position: relative;
    }

    .search-icon::before {
      content: '';
      position: absolute;
      left: 20%;
      top: 16%;
      width: 52%;
      height: 28%;
      border-top: 7px solid #ffffff;
      border-radius: 999px 999px 0 0;
      transform: rotate(15deg);
    }

    .search-icon::after {
      content: '';
      position: absolute;
      right: -40%;
      bottom: -24%;
      width: 52%;
      height: 7px;
      border-radius: 999px;
      background: #ffffff;
      transform: rotate(45deg);
      transform-origin: left center;
    }

    .black-band {
      position: absolute;
      inset: 0;
      background: #000000;
      clip-path: polygon(0 42.8%, 100% 13.2%, 100% 54.2%, 0 87.8%);
      z-index: 1;
    }

    .white-slice {
      position: absolute;
      inset: 0;
      background: #ffffff;
      clip-path: polygon(0 75.8%, 100% 55.5%, 100% 100%, 0 100%);
      z-index: 2;
    }

    .scan-lines {
      position: absolute;
      top: 37.8%;
      left: 40%;
      width: 25%;
      height: 0.7%;
      z-index: 6;
      display: flex;
      gap: 4%;
    }

    .scan-lines span {
      display: block;
      height: 100%;
      border-radius: 999px;
    }

    .scan-lines span:first-child {
      width: 42%;
      background: var(--teal);
    }

    .scan-lines span:last-child {
      flex: 1;
      background: #222831;
    }

    .pause-mark {
      position: absolute;
      left: 8.5%;
      top: 45%;
      width: 12.2%;
      aspect-ratio: 1;
      border: 7px solid #ffffff;
      border-radius: 50%;
      background: #030614;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9%;
      z-index: 8;
    }

    .pause-mark span {
      width: 8.6%;
      height: 40%;
      border-radius: 999px;
      background: #ffffff;
    }

    .main-title {
      position: absolute;
      top: 45.3%;
      left: 30%;
      z-index: 7;
      color: #ffffff;
      font-size: 12.2cqw;
      line-height: 0.9;
      font-weight: 900;
      letter-spacing: -0.045em;
      white-space: nowrap;
      text-shadow: 0 10px 22px rgba(0, 0, 0, 0.32);
    }

    .chips {
      position: absolute;
      left: 27.6%;
      right: 27.6%;
      top: 80.6%;
      z-index: 9;
      display: flex;
      justify-content: center;
      gap: 2.2%;
    }

    .chips span {
      min-width: 21%;
      height: 5.8%;
      padding: 0 1.1%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 3px dotted #111111;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.92);
      color: #111111;
      font-size: 2.05cqw;
      line-height: 1;
      font-weight: 900;
      white-space: nowrap;
    }

    .contact {
      position: absolute;
      left: 18%;
      right: 18%;
      bottom: 3.6%;
      z-index: 9;
      display: grid;
      gap: 0.9vh;
      color: #111111;
      font-size: 1.45cqw;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-align: center;
    }

    .contact-row {
      display: flex;
      justify-content: center;
      gap: 3.2%;
      white-space: nowrap;
    }

    @media (max-width: 720px) {
      body {
        padding: 12px;
      }

      .toolbar {
        flex-direction: column;
        align-items: flex-start;
      }

      .poster-shell {
        width: min(96vw, 390px);
      }

      .search-icon {
        border-width: 4px;
      }

      .search-icon::before {
        border-top-width: 4px;
      }

      .search-icon::after {
        height: 4px;
      }

      .pause-mark {
        border-width: 4px;
      }

      .chips span {
        border-width: 1.5px;
      }
    }
  </style>
</head>
<body>
  <main class="workspace">
    <input id="show-reference" type="checkbox" hidden />
    <div class="toolbar">
      <label for="show-reference">叠加原始 PNG 参考图</label>
      <small>目标：先在这个独立文件中把 HTML/CSS 海报调到接近一比一，再集成到站点弹窗。</small>
    </div>
    <section class="poster-shell" aria-label="StudyHub poster prototype">
      <div class="poster">
        <div class="brand">STUDYHUB · 学汇</div>
        <div class="address-bar">
          <span class="dot red"></span>
          <span class="dot yellow"></span>
          <span class="dot green"></span>
          <span class="url">https://study-hub.cn</span>
          <span class="search-icon"></span>
        </div>
        <div class="black-band"></div>
        <div class="white-slice"></div>
        <div class="scan-lines"><span></span><span></span></div>
        <div class="pause-mark"><span></span><span></span></div>
        <div class="main-title">StudyHub</div>
        <div class="chips">
          <span>贡献资料</span>
          <span>获取所需</span>
          <span>经验分享</span>
          <span>校园集市</span>
        </div>
        <div class="contact">
          <div class="contact-row"><span>联系邮箱</span><span>chengjinli@std.uestc.edu.cn</span></div>
          <div class="contact-row"><span>核心贡献者</span><span>李承锦</span><span>肖治旭</span></div>
        </div>
      </div>
      <img class="poster-reference" src="../frontend/public/local/stable-version-poster.png" alt="" />
    </section>
  </main>
</body>
</html>
