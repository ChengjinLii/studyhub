schema_version: studyhub.areal.config.v1
job_name: studyhub-agent-v2-kdrl-4b
model:
  name_or_path: artifacts/checkpoints/opd-4b
  tokenizer_path: models/Qwen3.5-4B
  dtype: bfloat16
  max_sequence_length: 8192
data:
  train_path: artifacts/training/kdrl-trajectories.jsonl
  eval_path: eval/agentbench/v1/cases.jsonl
  trajectory_schema: studyhub.trajectory.v1
runtime:
  output_dir: artifacts/checkpoints/kdrl-4b
  seed: 6212
  per_device_batch_size: 1
  gradient_accumulation_steps: 16
  gradient_checkpointing: true
  requires_cuda: true
algorithm:
  name: kdrl
  parameters:
    distillation_weight: 0.5
    reinforcement_weight: 0.5
