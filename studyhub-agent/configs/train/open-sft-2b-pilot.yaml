experiment_name: studyhub-open-sft-2b
trial_name: pilot-r16-lr2e5-seed1

seed: 1
enable_offload: false
total_train_epochs: 1
total_train_steps: null
tokenizer_path: ${actor.path}

cluster:
  n_nodes: 1
  n_gpus_per_node: 1
  fileroot: /data/chengjin/studyhub/studyhub-agent/artifacts/areal
  name_resolve:
    type: nfs
    nfs_record_root: /data/chengjin/studyhub/studyhub-agent/artifacts/areal/name_resolve

scheduler:
  type: local

actor:
  backend: fsdp:d1p1t1
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  path: /data/chengjin/studyhub/models/P0/Qwen3.5-2B
  attn_impl: sdpa
  init_from_scratch: false
  gradient_checkpointing: true
  dtype: bfloat16
  use_lora: true
  lora_rank: 16
  lora_alpha: 16
  target_modules: [all-linear]
  mb_spec:
    max_tokens_per_mb: 2048
  optimizer:
    type: adam
    lr: 2.0e-5
    weight_decay: 0.05
    beta1: 0.9
    beta2: 0.95
    eps: 1.0e-5
    lr_scheduler_type: cosine
    warmup_steps_proportion: 0.03
    gradient_clipping: 1.0
  scheduling_spec:
    - task_type: worker
      port_count: 2
      gpu: 1
      mem: 24
      cmd: python3 -m areal.infra.rpc.rpc_server
      env_vars:
        WANDB_MODE: disabled
        HF_HUB_OFFLINE: "1"
        TRANSFORMERS_OFFLINE: "1"

train_dataset:
  batch_size: 16
  shuffle: true
  drop_last: true
  pin_memory: true
  num_workers: 2
  path: /data/chengjin/studyhub/studyhub-agent/datasets/processed/open_sft_bootstrap_v1/hf_dataset
  type: sft

valid_dataset:
  batch_size: 16
  shuffle: false
  drop_last: false
  pin_memory: true
  num_workers: 2
  path: /data/chengjin/studyhub/studyhub-agent/datasets/processed/open_sft_bootstrap_v1/hf_dataset
  type: sft

saver:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: 1
  freq_steps: 40
  freq_secs: null

recover:
  mode: disabled
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: 1
  freq_steps: null
  freq_secs: null

evaluator:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: 1
  freq_steps: 40
  freq_secs: null

stats_logger:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  wandb:
    mode: disabled
