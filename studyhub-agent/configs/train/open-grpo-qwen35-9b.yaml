experiment_name: studyhub-open-grpo-9b
trial_name: direct-seed-6209

seed: 6209
enable_offload: false
total_train_epochs: 1
total_train_steps: null
tokenizer_path: ${actor.path}
workflow: training.rl.hermes_workflow.StudyHubHermesWorkflow
eval_workflow: ${workflow}
max_turns: 6
environment_root: /data/chengjin/studyhub/studyhub-agent/datasets/processed/open_agent_rl_v1
verifier_root: /data/chengjin/studyhub/studyhub-agent/datasets/processed/open_agent_rl_v1/verifiers
hermes_checkout: /data/chengjin/studyhub/studyhub-agent/.vendor/hermes-agent
reward_artifact_root: /data/chengjin/studyhub/studyhub-agent/artifacts/areal/reward-v2/9b

cluster:
  n_nodes: 1
  n_gpus_per_node: 2
  fileroot: /data/chengjin/studyhub/studyhub-agent/artifacts/areal
  name_resolve:
    type: nfs
    nfs_record_root: /data/chengjin/studyhub/studyhub-agent/artifacts/areal/name_resolve

scheduler:
  type: local

rollout:
  backend: sglang:d1
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  max_concurrent_rollouts: 8
  queue_size: null
  consumer_batch_size: ${train_dataset.batch_size}
  max_head_offpolicyness: 0
  enable_rollout_tracing: false
  scheduling_spec: ${actor.scheduling_spec}
  use_lora: true
  fileroot: ${cluster.fileroot}
  tokenizer_path: ${tokenizer_path}
  dump_to_file: true
  agent:
    mode: subproc
    admin_api_key: ${oc.env:STUDYHUB_AREAL_ADMIN_API_KEY}
    subproc_max_workers: 4
    engine_max_tokens: 4096
    tool_call_parser: qwen3_coder
    reasoning_parser: qwen3
    chat_template_type: hf
    export_style: individual
    turn_discount: 1.0

gconfig:
  n_samples: 4
  drop_incomplete_group: true
  min_new_tokens: 0
  max_new_tokens: 1536
  max_tokens: 4096
  greedy: false
  temperature: 1.0
  top_p: 1.0
  lora_name: studyhub-grpo-9b

actor:
  backend: fsdp:d1
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  path: /data/chengjin/studyhub/models/P1/Qwen3.5-9B
  attn_impl: sdpa
  init_from_scratch: false
  disable_dropout: true
  gradient_checkpointing: true
  dtype: bfloat16
  mb_spec:
    max_tokens_per_mb: 4096
  optimizer:
    type: adam
    lr: 5.0e-6
    weight_decay: 0.01
    beta1: 0.9
    beta2: 0.95
    eps: 1.0e-5
    lr_scheduler_type: constant
    gradient_clipping: 1.0
    warmup_steps_proportion: 0.03
  eps_clip: 0.2
  temperature: ${gconfig.temperature}
  reward_scaling: 1.0
  reward_bias: 0.0
  kl_ctl: 0.02
  mask_no_eos_with_zero: true
  ppo_n_minibatches: 1
  recompute_logprob: true
  use_decoupled_loss: true
  rejection_sampling:
    level: token
    action: mask
    metric: ratio
    upper: 5.0
  reward_norm:
    mean_level: group
    std_level: group
    group_size: ${gconfig.n_samples}
  adv_norm:
    mean_level: batch
    std_level: batch
  max_new_tokens: ${gconfig.max_new_tokens}
  weight_update_mode: disk
  use_lora: ${rollout.use_lora}
  peft_type: lora
  lora_rank: 16
  lora_alpha: 16
  target_modules: [o_proj, gate_proj, up_proj, down_proj]
  scheduling_spec:
    - task_type: worker
      port_count: 2
      gpu: 1
      mem: 72
      cmd: python3 -m areal.infra.rpc.rpc_server
      env_vars:
        WANDB_MODE: disabled
        HF_HUB_OFFLINE: "1"
        TRANSFORMERS_OFFLINE: "1"

ref:
  backend: ${actor.backend}
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  path: ${actor.path}
  attn_impl: ${actor.attn_impl}
  init_from_scratch: false
  disable_dropout: true
  dtype: ${actor.dtype}
  mb_spec:
    max_tokens_per_mb: 4096
  optimizer: null
  scheduling_strategy:
    type: colocation
    target: actor
  scheduling_spec: ${actor.scheduling_spec}

sglang:
  model_path: ${actor.path}
  random_seed: ${seed}
  skip_tokenizer_init: true
  dtype: ${actor.dtype}
  disable_overlap_schedule: true
  sampling_backend: pytorch
  max_running_requests: 8
  context_length: 8192
  mem_fraction_static: 0.65
  enable_lora: ${actor.use_lora}
  max_lora_rank: ${actor.lora_rank}
  max_loaded_loras: 1
  max_loras_per_batch: 1

vllm:
  model: ${actor.path}
  seed: ${seed}
  skip_tokenizer_init: false
  dtype: ${actor.dtype}
  max_model_len: 8192
  gpu_memory_utilization: 0.65
  enable_lora: ${rollout.use_lora}
  max_lora_rank: ${actor.lora_rank}

train_dataset:
  batch_size: 8
  shuffle: true
  drop_last: true
  pin_memory: true
  num_workers: 2
  path: /data/chengjin/studyhub/studyhub-agent/datasets/processed/open_agent_rl_v1/hf_dataset
  type: rl
  max_length: 8192

valid_dataset:
  batch_size: 8
  shuffle: false
  drop_last: false
  pin_memory: true
  num_workers: 2
  path: /data/chengjin/studyhub/studyhub-agent/datasets/processed/open_agent_rl_v1/hf_dataset
  type: rl
  max_length: 8192

saver:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: 1
  freq_steps: null
  freq_secs: null

recover:
  mode: auto
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: null
  freq_steps: 25
  freq_secs: null

evaluator:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: 1
  freq_steps: null
  freq_secs: null

stats_logger:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  wandb:
    mode: disabled

perf_tracer:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  enabled: false
  session_tracer:
    enabled: false
