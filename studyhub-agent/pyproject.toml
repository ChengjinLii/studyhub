[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "studyhub-agent"
version = "0.1.0"
description = "Standalone StudyHub Agent runtime, training, and evaluation workspace"
readme = "README.md"
requires-python = ">=3.12,<3.13"

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "ruff>=0.8,<0.14",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["studyhub_agent*", "ml*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 140

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["F401", "F841"]
