[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "studyhub-agent-v2"
version = "0.1.0"
description = "StudyHub Agent V2 contracts, tools, evaluation, and training adapters"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "PyYAML>=6.0,<7.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "ruff>=0.9,<0.14",
]

[tool.hatch.build.targets.wheel]
packages = ["src/studyhub_agent"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src", "ai_platform/rag_experiments/src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
