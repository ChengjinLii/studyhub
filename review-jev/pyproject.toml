[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "studyhub-review-jev"
version = "0.3.0"
description = "Standalone StudyHub text and image review, based on OneJev"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "UPSTREAM.md"]
requires-python = ">=3.10"
dependencies = [
  "pillow>=10",
  "jinja2>=3.1",
  "pydantic>=2.0",
  "fastapi>=0.110",
  "uvicorn>=0.30",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
guard = ["transformers>=5.0,<6", "torch>=2.6", "safetensors>=0.4", "httpx[socks]>=0.27,<1"]
torch = ["transformers>=5.0,<6", "torch>=2.6", "torchvision>=0.21", "accelerate>=1.0", "safetensors>=0.4", "httpx[socks]>=0.27,<1"]
gguf = ["transformers>=5.0,<6"]
dev = ["pytest>=8", "ruff>=0.11", "typesafe-sdk>=0.6"]
train = ["transformers>=5.0,<6", "torch>=2.6", "torchvision>=0.21", "accelerate>=1.0", "safetensors>=0.4", "peft>=0.13", "pyyaml>=6", "pyarrow>=14"]

[project.scripts]
qev = "qev.cli:main"
review-jev = "review_jev.cli:main"

[tool.setuptools.packages.find]
include = ["qev*", "review_jev*", "train*"]

[tool.setuptools.package-data]
qev = ["playground/*.html"]
review_jev = ["policies/*.json"]
train = ["configs/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
include = ["review_jev/**/*.py", "tests/test_review*.py"]

[tool.ruff.lint]
select = ["E", "F", "I"]
