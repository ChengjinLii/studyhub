name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  repo-hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Check shell script syntax
        run: bash scripts/check-shell-scripts.sh
      - name: Check sensitive tracked files
        run: bash scripts/security/check-sensitive-files.sh
      - name: Check code size budget
        run: node scripts/check-code-size.mjs

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: python -m pip install --require-hashes -r backend/requirements.lock
      - name: Run backend ruff
        run: python -m ruff check backend/app backend/tests
      - name: Run backend tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p reports/coverage
          if ! python -m pytest -vv --maxfail=1 backend/tests --cov=backend/app --cov-report=term-missing --cov-report=xml:reports/coverage/backend-coverage.xml --cov-fail-under=75 2>&1 | tee reports/coverage/backend-test.log; then
            {
              echo "Backend tests failed on GitHub Actions."
              echo
              echo "Python:"
              python --version
              echo
              echo "Last backend test output:"
              tail -n 80 reports/coverage/backend-test.log
            } > reports/coverage/backend-test-summary.log
            summary="$(python -c 'from pathlib import Path; text = Path("reports/coverage/backend-test-summary.log").read_text(encoding="utf-8", errors="replace")[-7000:]; print(text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))')"
            echo "::error file=backend-tests::${summary}"
            exit 1
          fi

  python-dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install audit tool
        run: python -m pip install --index-url https://pypi.org/simple pip-audit==2.9.0
      - name: Audit locked backend dependencies
        run: python -m pip_audit -r backend/requirements.lock --disable-pip

  backend-mysql-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: studyhub-ci-root
          MYSQL_DATABASE: studyhub_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pstudyhub-ci-root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: python -m pip install --require-hashes -r backend/requirements.lock
      - name: Run critical tests against MySQL
        env:
          STUDYHUB_TEST_DATABASE_URL: mysql+pymysql://root:studyhub-ci-root@127.0.0.1:3306/studyhub_ci?charset=utf8mb4
        run: >-
          python -m pytest -q
          backend/tests/test_order_payment_integrity.py
          backend/tests/test_payout_transfer_binding.py
          backend/tests/test_batch_submissions.py
          backend/tests/test_lock_provider.py

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        env:
          npm_config_engine_strict: "true"
        run: npm ci
      - name: Reject high-risk production dependency advisories
        run: bash scripts/security/audit-frontend-dependencies.sh
      - name: Run frontend checks
        working-directory: frontend
        run: npm run check
      - name: Run frontend strict typecheck subset
        working-directory: frontend
        run: npm run typecheck:strict
      - name: Run frontend unit tests
        working-directory: frontend
        run: npm run test:unit
      - name: Exclude unrelated Chrome apt repository
        shell: bash
        run: |
          # Playwright downloads its own Chromium. An inconsistent third-party
          # Chrome index must not break installation of Ubuntu system libraries.
          for source in /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            if [ -f "$source" ] && grep -Eq 'https?://dl\.google\.com/linux/chrome(-stable)?/deb' "$source"; then
              sudo mv -- "$source" "$source.studyhub-disabled"
            fi
          done
      - name: Install Playwright browsers
        working-directory: frontend
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if npx playwright install --with-deps chromium > /tmp/studyhub-browser-install.log 2>&1; then
              cat /tmp/studyhub-browser-install.log
              exit 0
            fi
            cat /tmp/studyhub-browser-install.log
            if [ "$attempt" -eq 3 ]; then
              detail="$(node -e 'const fs = require("fs"); const text = fs.readFileSync("/tmp/studyhub-browser-install.log", "utf8").slice(-6000); process.stdout.write(text.replaceAll("%", "%25").replaceAll("\r", "%0D").replaceAll("\n", "%0A"))')"
              echo "::error title=Browser installation diagnostics::${detail}"
              echo "::error::Playwright browser installation failed after three attempts"
              exit 1
            fi
            sleep $((attempt * 15))
          done
      - name: Run frontend critical tests
        working-directory: frontend
        run: npm run test:critical -- --reporter=line
      - name: Run frontend production critical tests
        working-directory: frontend
        run: npm run test:critical:prod -- --reporter=line
