name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  repo-hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      - name: Check shell script syntax
        run: bash scripts/check-shell-scripts.sh
      - name: Check sensitive tracked files
        run: bash scripts/security/check-sensitive-files.sh
      - name: Check code size budget
        run: node scripts/check-code-size.mjs

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: python -m pip install -e 'backend[dev]'
      - name: Run backend ruff
        run: python -m ruff check backend/app backend/tests
      - name: Run backend tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p reports/coverage
          if ! python -m pytest -vv --maxfail=1 backend/tests --cov=backend/app --cov-report=term-missing --cov-report=xml:reports/coverage/backend-coverage.xml 2>&1 | tee reports/coverage/backend-test.log; then
            {
              echo "Backend tests failed on GitHub Actions."
              echo
              echo "Python:"
              python --version
              echo
              echo "Last backend test output:"
              tail -n 80 reports/coverage/backend-test.log
            } > reports/coverage/backend-test-summary.log
            summary="$(python -c 'from pathlib import Path; text = Path("reports/coverage/backend-test-summary.log").read_text(encoding="utf-8", errors="replace")[-7000:]; print(text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))')"
            echo "::error file=backend-tests::${summary}"
            exit 1
          fi

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Report production dependency advisories
        working-directory: frontend
        run: |
          if ! npm audit --omit=dev --audit-level=high; then
            echo "::warning::Production dependency advisories were reported. Review npm audit output above; this report-only step does not block CI."
          fi
      - name: Run frontend checks
        working-directory: frontend
        run: npm run check
      - name: Run frontend strict typecheck subset
        working-directory: frontend
        run: npm run typecheck:strict
      - name: Run frontend unit tests
        working-directory: frontend
        run: npm run test:unit
      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run frontend critical tests
        working-directory: frontend
        run: npm run test:critical -- --reporter=line
