name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  repo-hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check shell script syntax
        run: bash scripts/check-shell-scripts.sh
      - name: Check sensitive tracked files
        run: bash scripts/security/check-sensitive-files.sh
      - name: Check code size budget
        run: node scripts/check-code-size.mjs

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: python -m pip install -e 'backend[dev]'
      - name: Run backend ruff
        run: python -m ruff check backend/app backend/tests
      - name: Run backend tests
        run: mkdir -p reports/coverage && python -m pytest backend/tests --cov=backend/app --cov-report=term-missing --cov-report=xml:reports/coverage/backend-coverage.xml

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Report production dependency advisories
        working-directory: frontend
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high
      - name: Run frontend checks
        working-directory: frontend
        run: npm run check
      - name: Run frontend unit tests
        working-directory: frontend
        run: npm run test:unit
      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run frontend critical tests
        working-directory: frontend
        run: npm run test:critical
