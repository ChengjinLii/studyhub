name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  repo-hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      - name: Check shell script syntax
        run: bash scripts/check-shell-scripts.sh
      - name: Check sensitive tracked files
        run: bash scripts/security/check-sensitive-files.sh
      - name: Check code size budget
        run: node scripts/check-code-size.mjs

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: python -m pip install -e 'backend[dev]'
      - name: Run backend ruff
        run: python -m ruff check backend/app backend/tests
      - name: Run backend tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p reports/coverage
          if ! python -m pytest -vv --maxfail=1 backend/tests --cov=backend/app --cov-report=term-missing --cov-report=xml:reports/coverage/backend-coverage.xml 2>&1 | tee reports/coverage/backend-test.log; then
            {
              echo "Backend tests failed on GitHub Actions."
              echo
              echo "Python:"
              python --version
              echo
              echo "Last backend test output:"
              tail -n 80 reports/coverage/backend-test.log
            } > reports/coverage/backend-test-summary.log
            summary="$(python -c 'from pathlib import Path; text = Path("reports/coverage/backend-test-summary.log").read_text(encoding="utf-8", errors="replace")[-7000:]; print(text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))')"
            echo "::error file=backend-tests::${summary}"
            exit 1
          fi

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Report production dependency advisories
        working-directory: frontend
        run: |
          if ! npm audit --omit=dev --audit-level=high; then
            echo "::warning::Production dependency advisories were reported. Review npm audit output above; this report-only step does not block CI."
          fi
      - name: Run frontend checks
        working-directory: frontend
        run: npm run check
      - name: Run frontend strict typecheck subset
        working-directory: frontend
        run: npm run typecheck:strict
      - name: Run frontend unit tests
        working-directory: frontend
        run: npm run test:unit
      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run frontend critical tests
        working-directory: frontend
        run: npm run test:critical -- --reporter=line

  agentic-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: python -m pip install -e 'backend[dev]'
      - name: Run offline Agentic smoke gate
        run: STUDYHUB_PYTHON_BIN="$(command -v python)" bash scripts/research/agentic-smoke.sh

  agentic-execution-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: python -m pip install -e 'backend[dev]'
      - name: Run Agentic execution fixture integration
        run: STUDYHUB_PYTHON_BIN="$(command -v python)" bash scripts/research/agentic-execution-e2e.sh

  trajectory-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: python -m pip install -e 'backend[dev]'
      - name: Verify immutable trajectory and export contracts
        run: STUDYHUB_PYTHON_BIN="$(command -v python)" bash scripts/research/trajectory-integrity.sh

  mysql-migration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: studyhub_agentic_ci
          MYSQL_USER: studyhub
          MYSQL_PASSWORD: studyhub
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: python -m pip install -e 'backend[dev]'
      - name: Upgrade and inspect MySQL Agentic schema
        env:
          STUDYHUB_DATABASE_URL: mysql+pymysql://studyhub:studyhub@127.0.0.1:3306/studyhub_agentic_ci?charset=utf8mb4
        run: STUDYHUB_PYTHON_BIN="$(command -v python)" bash scripts/research/mysql-agentic-migration.sh
