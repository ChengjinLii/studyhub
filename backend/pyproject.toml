[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "studyhub-fastapi"
version = "0.1.0"
description = "StudyHub FastAPI migration skeleton"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "bcrypt>=4.1,<5.0",
  "email-validator>=2.2,<3.0",
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.34,<0.35",
  "sqlalchemy>=2.0,<2.1",
  "PyMySQL>=1.1,<2.0",
  "pydantic-settings>=2.8,<3.0",
  "PyJWT>=2.10,<3.0",
  "pillow>=11.1,<12.0",
  "httpx>=0.28,<0.29",
  "python-multipart>=0.0.20,<0.1",
  "cryptography>=44.0,<45.0",
  "redis>=5.2,<6.0",
  "oss2>=2.19,<3.0",
  "python-alipay-sdk>=3.3.398",
  "aliyun-python-sdk-core>=2.16,<3.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0"
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
