[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "studyhub-fastapi"
version = "0.1.0"
description = "StudyHub FastAPI migration skeleton"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "bcrypt>=4.1,<5.0",
  "email-validator>=2.2,<3.0",
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.34,<0.52",
  "sqlalchemy>=2.0,<2.1",
  "aiosqlite>=0.20,<0.21",
  "aiomysql>=0.3,<0.4",
  "anyio>=4.14.2,<5.0",
  "PyMySQL>=1.1,<2.0",
  "pydantic-settings>=2.14.2,<3.0",
  "PyJWT>=2.13,<3.0",
  "pillow>=12.3,<13.0",
  "pypdf>=6.16.1,<7.0",
  "httpx>=0.28,<0.29",
  "mcp>=1.28.1,<2.0",
  "python-multipart>=0.0.31,<0.1",
  "cryptography>=50.0,<51.0",
  "pyOpenSSL>=26.0,<27.0",
  "redis>=5.2,<6.0",
  "starlette>=1.3.1,<2.0",
  "oss2>=2.19,<3.0",
  "python-alipay-sdk>=3.3.398",
  "aliyun-python-sdk-core>=2.16,<3.0"
]

[project.optional-dependencies]
dev = [
  "alembic>=1.13,<2.0",
  "hypothesis>=6.0,<7.0",
  "pytest>=9.0.3,<10.0",
  "pytest-cov>=5.0,<7.0",
  "ruff>=0.8,<0.14"
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", ".."]
addopts = "-q"
markers = [
  "private_sft_corpus: requires the ignored frozen public-material corpus used for SFT reproducibility checks",
]

[tool.ruff]
target-version = "py312"
line-length = 140

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["F401", "F841"]
